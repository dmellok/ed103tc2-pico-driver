; ed103tc2-pico-driver: minimal standalone driver for the Waveshare 10.3" e-Paper
; HAT (ED103TC2 glass, IT8951 controller, 1872x1404, 16-level grey) on a
; Pimoroni Pico Plus 2 W (RP2350B), via the Hard Stuff "Pico to Pi Hat".
;
; No WiFi, MQTT, sleep, or config -- just the panel: bring it up, draw test
; patterns and an embedded image, advance with BOOTSEL / serial / a button.
; Sibling of el133-pico-driver (same board, same adapter, different panel).
;
; Framework: the Raspberry Pi Pico SDK ("picosdk") via the maxgerhardt platform
; fork (RP2350 + the W board). We don't use the radio, so no lwIP wiring.
;
; ---- Build-time knobs (add to build_flags) -----------------------------------
;   -DEPD_VCOM_MV=1500      *** SET THIS *** from the label on the panel's FPC
;                           cable, in millivolts: "-1.50V" -> 1500, "-2.51V" ->
;                           2510. Unset = keep whatever the IT8951 reports and
;                           nag about it on the serial console (or type v1500
;                           there). A wrong VCOM degrades the panel over time.
;   -DEPD_PIN_CS=8 -DEPD_PIN_MISO=12 -DEPD_PIN_RST=17 -DEPD_PIN_HRDY=1
;                           pin overrides (defaults in include/epd_io.h, verified
;                           on the Hard Stuff adapter; if they don't answer the
;                           firmware sweeps the alternatives and prints the fix)
;   -DEPD_PIN_PROBE=0       disable the slow/mode-3/swapped fallbacks
;   -DEPD_SPI_HZ=9375000    SPI clock; default 12.5 MHz. Steps are 18.75 / 12.5 /
;                           9.375 / 7.5 MHz (integer PIO divider). 18.75 MHz
;                           corrupts reads through this adapter.
;   -DEPD_MIRROR_H=0        the 10.3" glass is mirrored relative to the IT8951
;                           raster; default 1 un-mirrors it. Flip if the test
;                           card's black corner square shows top-RIGHT.
;   -DBTN_PIN=15            optional external button (to GND), same grammar as BOOTSEL
;   -DLONG_PRESS_MS=600     short/long press threshold
;   -DMENU_MOVE_MODE=2      refresh menu moves with GC16 instead of A2 (6)
; ------------------------------------------------------------------------------

[env:pimoroni_pico_plus_2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pimoroni_pico_plus_2w
framework = picosdk

; stdio over USB CDC (printf -> serial monitor); never block at boot.
build_flags =
    -DPIO_STDIO_USB
    ; WiFi + lwIP for the web UI (RM2 module on the Pico Plus 2 W). Credentials
    ; come from include/wifi_secrets.h (gitignored; see the .example file).
    -DPICO_CYW43_SUPPORTED=1
    -DCYW43_HOST_NAME=\"ed103tc2\"

; Open the serial monitor with: pio device monitor
monitor_speed = 115200
; pico USB CDC stdio only emits once the host asserts DTR; assert it on connect.
monitor_dtr = 1
monitor_rts = 1
